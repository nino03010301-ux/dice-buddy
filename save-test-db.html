<title>ダイスバディ保存テスト</title>
<style>
/* 1カラム。上に判定ランプ、真ん中に記録ボタン、下に記録一覧と診断 */
:root{
  --bg:#eef1f7; --panel:#ffffff; --fg:#1b2233; --muted:#5d6782; --line:#d5dbe8;
  --accent:#3b5bdb; --accent-fg:#ffffff;
  --ok:#1f9d55; --ok-bg:#e3f6ea; --ng:#c92a2a; --ng-bg:#fde8e8; --wait:#8a6d00; --wait-bg:#fff4cc;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1b2030; --fg:#e8ecf6; --muted:#9aa4bf; --line:#2c3449;
  --accent:#7c94ff; --accent-fg:#0d1020;
  --ok:#5fd68f; --ok-bg:#16301f; --ng:#ff8a8a; --ng-bg:#3a1a1a; --wait:#f0cf5a; --wait-bg:#33290b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1b2030; --fg:#e8ecf6; --muted:#9aa4bf; --line:#2c3449;
  --accent:#7c94ff; --accent-fg:#0d1020;
  --ok:#5fd68f; --ok-bg:#16301f; --ng:#ff8a8a; --ng-bg:#3a1a1a; --wait:#f0cf5a; --wait-bg:#33290b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px;line-height:1.6}
.lamp{border-radius:14px;padding:16px;font-weight:700;font-size:18px;display:flex;gap:12px;align-items:center;border:2px solid currentColor}
.lamp .dot{width:18px;height:18px;border-radius:50%;background:currentColor;flex:none}
.lamp.wait{color:var(--wait);background:var(--wait-bg)}
.lamp.ok{color:var(--ok);background:var(--ok-bg)}
.lamp.ng{color:var(--ng);background:var(--ng-bg)}
.lamp small{display:block;font-weight:400;font-size:13px;margin-top:4px;word-break:break-all}
button.big{font:inherit;font-size:20px;font-weight:700;padding:22px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button.big:disabled{opacity:.4;cursor:not-allowed}
button.big:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.reason{color:var(--ng);font-size:14px;margin:-8px 0 0;min-height:1em}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
section h2{font-size:15px;margin:0 0 10px;color:var(--muted);letter-spacing:.04em}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
li:last-child{border-bottom:0}
li span:last-child{color:var(--muted);text-align:right}
.empty{color:var(--muted);font-size:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;font-family:var(--mono);font-size:13px;word-break:break-all;min-width:0}
.okt{color:var(--ok)} .ngt{color:var(--ng)}
</style>

<div class="wrap">
  <div>
    <h1>ダイスバディ 保存テスト</h1>
    <p class="sub">ゲーム本体を作る前に、Claudeのクラウド保存がiPhoneとPCで正しく動くかを確かめるページです。</p>
  </div>

  <div id="lamp" class="lamp wait"><span class="dot"></span><div><span id="lampText">保存機能に接続しています…</span><small id="lampSub"></small></div></div>

  <button id="saveBtn" class="big" disabled>テスト記録を1件保存する</button>
  <p id="reason" class="reason">保存機能の準備ができるまで押せません。</p>

  <section>
    <h2>保存されている記録（<span id="count">0</span>件）</h2>
    <ul id="list"><li class="empty">まだ記録はありません。上のボタンで1件保存してください。</li></ul>
  </section>

  <section>
    <h2>診断</h2>
    <dl>
      <dt>保存機能</dt><dd id="dDb">確認中</dd>
      <dt>あなた専用の場所</dt><dd id="dUser">確認中</dd>
      <dt>書く→読み直し</dt><dd id="dVerify">まだ試していません</dd>
      <dt>起動のしかた</dt><dd id="dMode"></dd>
      <dt>端末</dt><dd id="dDevice"></dd>
      <dt>最後のエラー</dt><dd id="dErr">なし</dd>
    </dl>
  </section>
</div>

<script>
(function(){
  var db = null, uid = null, records = [];
  var $ = function(id){ return document.getElementById(id); };

  function errText(e){
    if (!e) return "不明なエラー";
    var code = e.code || e.name || "";
    return (code ? code + " / " : "") + (e.message || String(e));
  }
  function setLamp(kind, text, sub){
    $("lamp").className = "lamp " + kind;
    $("lampText").textContent = text;
    $("lampSub").textContent = sub || "";
  }
  function setErr(e){ $("dErr").textContent = errText(e); $("dErr").className = "ngt"; }
  function device(){
    var ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
    if (/Android/.test(ua)) return "Android";
    if (/Macintosh/.test(ua)) return "Mac";
    if (/Windows/.test(ua)) return "Windows";
    return "その他";
  }
  function mode(){
    var standalone = false;
    try { standalone = window.navigator.standalone === true ||
      (window.matchMedia && matchMedia("(display-mode: standalone)").matches); } catch(e){}
    try { if (!standalone && window.top && window.top.navigator.standalone === true) standalone = true; } catch(e){}
    return standalone ? "ホーム画面のアイコンから" : "ブラウザから（ホーム画面から開いた場合も判定できないことがあります）";
  }
  function fmt(ts){
    var d = new Date(ts), p = function(n){ return (n < 10 ? "0" : "") + n; };
    return (d.getMonth()+1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function render(){
    $("count").textContent = records.length;
    var ul = $("list"); ul.textContent = "";
    if (!records.length){
      var li = document.createElement("li"); li.className = "empty";
      li.textContent = "まだ記録はありません。上のボタンで1件保存してください。";
      ul.appendChild(li); return;
    }
    records.slice().sort(function(a,b){ return b.ts - a.ts; }).forEach(function(r){
      var li = document.createElement("li");
      var a = document.createElement("span"); a.textContent = fmt(r.ts);
      var b = document.createElement("span"); b.textContent = r.device + "・" + r.mode;
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });
  }
  function toRec(d){
    var data = (d && typeof d.data === "function") ? d.data() : (d && d.data ? d.data : d);
    return { id:(d && d.id) || "", ts:Number(data && data.ts) || 0,
             device:String((data && data.device) || "?"), mode:String((data && data.mode) || "?") };
  }
  function col(){ return db.collection("data/users/" + uid).doc("savetest").collection("records"); }

  function loadAll(){
    return col().get().then(function(snap){
      var docs = (snap && snap.docs) ? snap.docs : (Array.isArray(snap) ? snap : []);
      records = docs.map(toRec).filter(function(r){ return r.ts > 0; });
      render();
    });
  }

  function save(){
    if (!db || !uid) return;
    var btn = $("saveBtn"); btn.disabled = true;
    var ts = Date.now();
    var rec = { id:"r" + ts, ts:ts, device:device(), mode:/ホーム/.test(mode()) ? "ホーム画面" : "ブラウザ" };
    setLamp("wait", "保存中…");
    var ref = col().doc(rec.id);
    ref.set({ ts:rec.ts, device:rec.device, mode:rec.mode })
      .then(function(){ return ref.get(); })
      .then(function(doc){
        var data = doc && doc.exists ? doc.data() : null;
        if (!data || data.ts !== rec.ts) throw new Error("保存した記録を読み直せませんでした");
        records.push(rec); render();
        $("dVerify").textContent = "一致しました（" + fmt(ts) + "）"; $("dVerify").className = "okt";
        setLamp("ok", "保存しました", "書いたあとに読み直して、同じ内容が返ってくることを確認しました。");
      })
      .catch(function(e){
        $("dVerify").textContent = "失敗"; $("dVerify").className = "ngt";
        setErr(e);
        setLamp("ng", "保存できていません", errText(e));
      })
      .then(function(){ btn.disabled = false; });
  }

  $("dMode").textContent = mode();
  $("dDevice").textContent = device();
  $("saveBtn").addEventListener("click", save);

  function fail(msg, e){
    $("reason").textContent = msg;
    setLamp("ng", "保存機能が使えません", e ? errText(e) : msg);
    if (e) setErr(e);
  }

  if (!window.claude || typeof window.claude.use !== "function"){
    $("dDb").textContent = "つながっていません"; $("dDb").className = "ngt";
    $("dUser").textContent = "-";
    fail("このページは claude.ai 上で開いたときだけ保存できます。");
    return;
  }

  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var ns = r[0], user = r[1];
    if (!ns){
      $("dDb").textContent = "使えません"; $("dDb").className = "ngt";
      fail("保存機能が使えません。一度ブラウザで claude.ai を開いてログインし直してください。");
      return;
    }
    db = ns; $("dDb").textContent = "つながりました"; $("dDb").className = "okt";
    return (user ? user.id() : Promise.resolve(null)).then(function(id){
      if (!id){
        $("dUser").textContent = "見つかりません"; $("dUser").className = "ngt";
        fail("あなた専用の保存場所が見つかりません。claude.ai にログインしてから開き直してください。");
        return;
      }
      uid = id; $("dUser").textContent = "あります"; $("dUser").className = "okt";
      return loadAll().then(function(){
        $("saveBtn").disabled = false;
        $("reason").textContent = "";
        setLamp("ok", "保存機能につながりました", "ボタンを押して1件保存してください。");
      });
    });
  }).catch(function(e){
    fail("保存機能の準備に失敗しました。", e);
  });
})();
</script>
